aid: zoho-analytics
name: Zoho Analytics
description: Zoho Analytics is a business intelligence and self-service analytics
  platform that provides a REST API for managing workspaces, views, reports, dashboards,
  data import and export, and sharing analytics content. The API enables ISVs, developers,
  and system integrators to embed powerful reporting and analytical capabilities into
  their applications. It supports OAuth 2.0 authentication, regional endpoints across
  eight data centers, and provides SDKs for Java, C#, Python, PHP, Go, and Node.js.
